name: Temporary Quality Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/free-stat-build-20261006

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Run tests
        working-directory: web
        run: npm test
