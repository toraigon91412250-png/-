name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep pull-request checks isolated so they cannot cancel a production Pages deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Run game tests
        working-directory: web
        run: npm test

      - name: Build web game
        working-directory: web
        env:
          VITE_BASE_PATH: /-/
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published Pages entry point and bundles
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          html_file="$(mktemp)"
          curl --fail --location --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$PAGES_URL" -o "$html_file"
          node --input-type=module - "$html_file" "$PAGES_URL" <<'NODE'
          import { readFile } from 'node:fs/promises';

          const [htmlPath, pageUrl] = process.argv.slice(2);
          const html = await readFile(htmlPath, 'utf8');
          if (!html.includes('バトルアリーナデュエル')) {
            throw new Error('Published page did not contain the expected game document title.');
          }

          const assets = [...html.matchAll(/(?:src|href)=["']([^"']+\\.(?:m?js|css)(?:\\?[^"']*)?)["']/g)]
            .map(match => match[1]);
          const scripts = assets.filter(asset => /\\.m?js(?:\\?|$)/.test(new URL(asset, pageUrl).pathname));
          if (scripts.length === 0) throw new Error('No built JavaScript entry point was found in the published HTML.');
          if (!assets.some(asset => /\\.css(?:\\?|$)/.test(new URL(asset, pageUrl).pathname))) {
            throw new Error('No built CSS asset was found in the published HTML.');
          }

          for (const asset of assets) {
            const url = new URL(asset, pageUrl);
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Published asset returned HTTP ${response.status}: ${url}`);
          }
          console.log(`Published page and ${assets.length} built JS/CSS assets returned HTTP 200.`);
          NODE
