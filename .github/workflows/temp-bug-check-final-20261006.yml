name: Temporary Final Bug Check

on:
  push:
    branches: [fix/bug-sweep-20261006]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Rule tests
        working-directory: web
        run: npm test
      - name: Build with Pages base path
        working-directory: web
        env:
          VITE_BASE_PATH: /-/
        run: npm run build
      - name: Verify final diff scope and bug fixes
        run: |
          node - <<'NODE'
          import { readFileSync } from 'node:fs';
          const screen = readFileSync('web/src/components/BattleScreen.tsx', 'utf8');
          const dock = readFileSync('web/src/components/ActionDock.tsx', 'utf8');
          const app = readFileSync('web/src/App.tsx', 'utf8');
          if (!screen.includes("onAction('SPECIAL', undefined, selectedSpecialSkill)")) throw new Error('Special keyboard wiring missing.');
          if (!dock.includes('selectedSpecialSkill: IrenaSpecialSkillId')) throw new Error('Selected special skill prop missing.');
          if (!app.includes('useRef(new Map<string, Promise<void>>())')) throw new Error('Stable preload cache missing.');
          NODE
      - name: Verify Pages asset output
        working-directory: web
        run: |
          node - <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          const files = readdirSync('dist/assets').filter(name => name.endsWith('.js'));
          const bundle = files.map(name => readFileSync('dist/assets/' + name, 'utf8')).join('\n');
          if (!bundle.includes('/-/assets/recruitment/')) throw new Error('Pages base path missing from recruitment assets.');
          NODE
