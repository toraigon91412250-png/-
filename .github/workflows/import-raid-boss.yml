name: Import Raid Boss prototype

on:
  push:
    paths:
      - .github/workflows/import-raid-boss.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Raid Boss prototype
        shell: bash
        run: |
          set -euo pipefail
          rm -rf raid-boss-prototype
          mkdir -p raid-boss-prototype
          unzip -q "raid-boss-prototype (1).zip" -d raid-boss-prototype

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- raid-boss-prototype
          if git diff --cached --quiet; then
            echo "No extracted files to commit."
            exit 0
          fi
          git commit -m "Import Raid Boss prototype project from ZIP"
          git push
