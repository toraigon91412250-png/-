name: Temporary Bug Check

on:
  push:
    branches: [fix/bug-sweep-20261006]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Rule tests
        working-directory: web
        run: npm test
      - name: Build with Pages base path
        working-directory: web
        env:
          VITE_BASE_PATH: /-/
        run: npm run build
      - name: Verify recruitment assets use Pages base path
        working-directory: web
        run: |
          node - <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          const files = readdirSync('dist/assets').filter(name => name.endsWith('.js'));
          const bundle = files.map(name => readFileSync('dist/assets/' + name, 'utf8')).join('\n');
          if (!bundle.includes('/-/assets/recruitment/')) {
            throw new Error('Built bundle does not contain Pages-based recruitment asset paths.');
          }
          NODE
      - name: Verify special keyboard wiring
        run: |
          node - <<'NODE'
          import { readFileSync } from 'node:fs';
          const screen = readFileSync('web/src/components/BattleScreen.tsx', 'utf8');
          const dock = readFileSync('web/src/components/ActionDock.tsx', 'utf8');
          if (!screen.includes("onAction('SPECIAL', undefined, selectedSpecialSkill)")) {
            throw new Error('BattleScreen keyboard shortcut is not wired to the selected special skill.');
          }
          if (!dock.includes('selectedSpecialSkill: IrenaSpecialSkillId')) {
            throw new Error('ActionDock does not receive the selected special skill.');
          }
          NODE
