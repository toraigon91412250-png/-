[build]
  base    = "web"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_BASE_PATH = "/"

# Serve index.html for any unknown path (SPA fallback)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

